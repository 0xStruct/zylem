[package]
name = "zylem-zakura-diff"
description = "Differential tests: Zylem's header rules and verifier against Zakura's independent implementation"
version = "0.0.1"
edition = "2021"
publish = false

# Its own workspace: Zakura's forked Zcash crates stay out of the main lockfile.
[workspace]

[dependencies]

[dev-dependencies]
zakura-chain = "=9.0.0"
zakura-header-chain = "=4.0.0"
zylem-header = { path = "../../crates/zylem-header" }
chrono = "0.4"
rand = "0.8"
primitive-types = "0.12"
hex = "0.4"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.test]
opt-level = 3
