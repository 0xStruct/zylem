[workspace]
resolver = "2"
members = [
    "crates/zylem-proto",
    "crates/zylem-header",
    "crates/zylem-core",
    "crates/zylem-build",
    "crates/zylem-proxy",
]
# Spikes and differential tests have their own workspaces.
exclude = ["spikes", "testing"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zylem-proto = { path = "crates/zylem-proto" }
zylem-core = { path = "crates/zylem-core" }
zylem-header = { path = "crates/zylem-header" }

# Zcash stack, pinned to the NU7 / Ironwood pre-releases that zcash-devtool builds against.
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }
zcash_encoding = "0.5"
zcash_history = "=0.6.0"
orchard = { version = "0.16", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
equihash = "0.3"

blake2b_simd = "1"
sha2 = "0.10"
primitive-types = { version = "0.12", default-features = false }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
zstd = "0.13"
thiserror = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "fs"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
