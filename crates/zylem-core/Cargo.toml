[package]
name = "zylem-core"
description = "Verifies Zcash light-wallet data against block headers: proof of work, the difficulty rule, transaction IDs, Merkle roots and note commitment trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Message types only; the gRPC stubs are for the server crates.
zylem-proto = { path = "../zylem-proto", default-features = false }
zylem-header.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_encoding.workspace = true
zcash_history.workspace = true
orchard.workspace = true
sapling.workspace = true
incrementalmerkletree.workspace = true
equihash.workspace = true
blake2b_simd.workspace = true
sha2.workspace = true
primitive-types.workspace = true
prost.workspace = true
thiserror.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

# Ring files are zstd. WebAssembly has no C toolchain, so clients there decode with a
# pure-Rust decoder; only native builders compress.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.8"

[dev-dependencies]
hex.workspace = true
