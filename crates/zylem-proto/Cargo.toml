[package]
name = "zylem-proto"
description = "Light-wallet protocol types and gRPC stubs, plus the Zylem Ring format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["grpc"]
# Client and server stubs for the light-wallet service. Off for WebAssembly, which needs
# only the message types.
grpc = ["dep:tonic", "dep:tonic-prost"]

[dependencies]
prost.workspace = true
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"
