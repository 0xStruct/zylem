[package]
name = "zylem-header"
description = "Zcash header-chain rules (difficulty adjustment, median time, work, Equihash) and the canonical records commitment, shared by zylem-core and the zkVM programs"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Explicit versions rather than workspace inheritance: the zkVM programs build this crate
# inside their own workspaces.
[dependencies]
# zkVM programs pin =0.10.8 and patch in their accelerated SHA-256.
sha2 = { version = "0.10", default-features = false }
primitive-types = { version = "0.12", default-features = false }
equihash = { version = "0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
