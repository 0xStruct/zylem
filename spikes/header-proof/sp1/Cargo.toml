[workspace]
resolver = "2"
members = ["program", "link", "leaf", "agg", "leaf-v2", "agg-v2", "script"]

[patch.crates-io]
# SP1's SHA-256 precompile (native builds fall back to the plain implementation).
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }

[profile.release]
opt-level = 3
