[package]
name = "zylem-hdr-sp1"
description = "Measures the header-chain program in SP1 on the same headers as the RISC Zero host"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
sp1-sdk = { version = "=6.9.0", features = ["blocking", "network"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
zylem-hdr = { package = "zylem-header", path = "../../../../crates/zylem-header" }
zylem-hdr-validate = { path = "../../validate" }
anyhow = "1"
serde_json = "1"
hex = "0.4"
sp1-verifier = "=6.9.0"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[features]
# GPU proving through SP1's CUDA server (SP1_PROVER=cuda).
cuda = ["sp1-sdk/cuda"]
# PLONK and Groth16 wrapping with gnark built from source (needs Go) instead of Docker.
native-gnark = ["sp1-sdk/native-gnark"]

[build-dependencies]
sp1-build = "=6.9.0"
