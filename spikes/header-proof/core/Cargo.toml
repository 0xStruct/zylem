[package]
name = "zylem-hdr"
description = "Zcash header-chain rules shared by the RISC Zero guest and the host"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
# Pinned so the guest can swap in RISC Zero's accelerated fork.
sha2 = { version = "=0.10.8", default-features = false }
primitive-types = { version = "0.12", default-features = false }
equihash = { version = "0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
