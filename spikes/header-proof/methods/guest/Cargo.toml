[package]
name = "header-chain"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
zylem-hdr = { package = "zylem-header", path = "../../../../crates/zylem-header" }
sha2 = { version = "=0.10.8", default-features = false }

[patch.crates-io]
# RISC Zero's SHA-256 accelerator.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = true
