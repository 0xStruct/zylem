[package]
name = "zylem-wasm-verify"
description = "Zylem client verification in WebAssembly: the history proof, its claim rules, and block records against the proof"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sp1-verifier = { version = "=6.9.0", default-features = false }
wasm-bindgen = "0.2"
zylem-header = { path = "../../../crates/zylem-header" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = "0.4"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
bincode = { version = "1.3", optional = true }
# A transitive dependency of the STARK verifier needs a randomness source on wasm32.
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = ["compressed"]
# The STARK verifier too (no trusted setup, 1.27 MB proofs).
compressed = ["sp1-verifier/full", "dep:bincode", "dep:getrandom"]

[profile.release]
opt-level = 3
lto = true
